<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>"
    />

    <title>Productive Dashboard</title>
  </head>
  <body>
    <main>
      <nav>
        <h2>Productivity Dashboard</h2>
      </nav>
      <section class="allTasks">
        <header>
          <!-- here all data will come from javascript we are not writting it hardcoded we fetch data by using WeatherAPI -->
        </header>
        <div class="allFeatures">
          <div class="todo elem" id="0">
            <img src="./assets/todoList.webp" alt="" />
            <h2>To Do List</h2>
          </div>
          <div class="daily elem" id="1">
            <img src="./assets/dailyPlanner.webp" alt="" />
            <h2>Daily Planner</h2>
          </div>
          <div class="motivation elem" id="2">
            <img src="./assets/motivation.webp" alt="" />
            <h2>Motivation</h2>
          </div>
          <div class="timer elem" id="3">
            <img src="./assets/dailyTimer.webp" alt="" />
            <h2>Pomodoro Timer</h2>
          </div>
        </div>
      </section>

      <!-- this is where all task saperately save -->
      <section class="separateTasks todo-fullTasks">
        <h1>Your Personalised Task List</h1>
        <button class="backBtn" id="0">Close</button>
        <div class="todoTasks">
          <div class="inputTasks">
            <form>
              <input id="taskInput" type="text" placeholder="Enter Task" />
              <textarea
                id="textarea"
                placeholder="Enter Description"
              ></textarea>
              <div class="checkbox">
                <input type="checkbox" id="check" />
                <label for="check">Important?</label>
              </div>
              <button type="submit">Add Task</button>
            </form>
          </div>
          <div class="allInputTasks"></div>
        </div>
      </section>

      <section class="separateTasks daily-fullTasks">
        <button class="backBtn" id="1">Close</button>
        <h1>Plan your Day to be more Productive</h1>

        <div class="day-planner"></div>
      </section>

      <section class="separateTasks motivation-fullTasks">
        <h1>Motivational Quotes</h1>
        <button class="backBtn" id="2">Close</button>
        <div class="motivation-container">
          <div class="motivation-wrapper">
            <div class="motivation-1">
              <h2>Quote of the Day</h2>
            </div>
            <div class="motivation-2">
              <h1>searching.....</h1>
            </div>
            <div class="motivation-3">
              <h2>Strenger Things</h2>
            </div>
          </div>
        </div>
      </section>

      <section class="separateTasks timer-fullTasks">
        <button class="backBtn" id="3">Close</button>
        <h1>Study with me!</h1>
        <h4 class="session">Work Session</h4>
        <div class="pomo-timer">
          <h1>25:00</h1>
          <button class="start-timer">Start</button>
          <button class="pause-timer">Pause</button>
          <button class="reset-timer">Reset</button>
        </div>
      </section>
    </main>
  </body>
  <script src="config.js"></script>
  <script src="script.js"></script>
</html>
